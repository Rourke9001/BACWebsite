name: Checks

# Gates on the code (separate from deploy.yml's deploy path). Watches develop too,
# not just PRs into main, or a bad chrome rebuild would first run once already on staging.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Catches a hand-edited generated region or a changed partial nobody rebuilt —
      # including api/src/blog-templates/, 5% of the files but 73% of the public URLs.
      - name: Site chrome is in sync with partials/ and data/site.json
        run: node scripts/build-chrome.mjs --check

      - name: API tests
        working-directory: api
        run: npm test
